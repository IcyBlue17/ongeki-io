name: Build MU3Input

on:
  workflow_dispatch:
  push:
    branches: [led-api]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild MU3Input/MU3Input.csproj -t:Restore -p:Configuration=Release -p:Platform=x64 "-p:SolutionDir=$PWD\"

      - name: Build
        run: msbuild MU3Input/MU3Input.csproj -p:Configuration=Release -p:Platform=x64 "-p:SolutionDir=$PWD\" -v:m

      - name: Show exports
        shell: cmd
        run: |
          for /f "delims=" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath') do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          dumpbin /exports MU3Input\bin\x64\Release\MU3Input.dll

      - uses: actions/upload-artifact@v4
        with:
          name: MU3Input-Release
          path: |
            MU3Input/bin/x64/Release/MU3Input.dll
            MU3Input/bin/x64/Release/MU3Input.dll.config
            MU3Input/bin/x64/Release/Newtonsoft.Json.dll
